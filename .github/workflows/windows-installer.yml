name: Build Windows companion installer
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'webpack/**'
      - 'windows/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-installer.yml'
    tags: ['companion-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and build
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm run dist
          if (!(Test-Path dist/index.js)) { throw 'Build did not produce dist/index.js' }
      - name: Prepare portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item (Get-Command node).Source bundle/node.exe
          Copy-Item windows/Start-Device-Control.cmd bundle/
          Copy-Item windows/Launch-Device-Control.ps1 bundle/
          Copy-Item dist bundle/dist -Recurse
          if (!(Test-Path bundle/dist/package.json)) { throw 'Generated dist/package.json is missing' }
          Push-Location bundle/dist
          npm install --omit=dev --no-audit --no-fund
          Pop-Location
          $zip = Join-Path $env:RUNNER_TEMP 'platform-tools.zip'
          Invoke-WebRequest 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath bundle -Force
          if (!(Test-Path bundle/platform-tools/adb.exe)) { throw 'ADB executable missing' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler not found' }
          & $compiler windows/companion.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-device-control-installer
          path: windows/output/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish directly downloadable installer
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-companion'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title 'Device Control Center for Windows' --notes 'Windows installer. Automatically updated after successful builds.' --target $env:GITHUB_SHA
          }
          gh release upload $tag 'windows/output/Device-Control-Center-Setup.exe' --clobber
